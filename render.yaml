databases:
  - name: starlight-demo-db
    databaseName: starlight
    user: starlight
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []

envVarGroups:
  - name: starlight-demo-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true

services:
  - type: web
    name: starlight-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: sh ./infra/start-render-demo.sh
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: starlight-demo-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: starlight-demo-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://qlqtkd-02-50-k21-2.vercel.app
      - key: PAYMENT_MODE
        value: mock
      - key: PUBLIC_DEMO_MODE
        value: "true"
